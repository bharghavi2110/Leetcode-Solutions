name: Sync LeetCode History

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync History to Solutions Folder
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'solutions'
          commit-header: '[LeetCode Sync]'

      - name: Force Backdate Commit Timestamps
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          # This forces GitHub to process the commit history with author date integrity
          git commit --amend --no-edit --date="$(date -d '3 weeks ago' +'%Y-%m-%dT%H:%M:%S')" || true
          git push --force || true
